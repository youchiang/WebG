<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>《下山大甩尾！》— 3D 手機直向賽車甩尾</title>

    <!-- Social Media Open Graph Tags (Threads / IG) -->
    <meta property="og:title" content="《下山大甩尾！》— 單手極限 3D 山路漂移挑戰" />
    <meta property="og:description" content="從山頂一路直衝山腳！單指滑動甩尾，掃飛沿途看熱鬧的觀賽人與柴柴！" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app-container">
      <canvas id="game-canvas"></canvas>

      <!-- 3D/Screen Floating Yeet Score Popups -->
      <div id="floating-popups-container"></div>

      <!-- Top Minimalist Mobile HUD -->
      <header id="top-hud" class="hidden">
        <div class="hud-top-bar">
          <div class="hud-score-box">
            <span class="hud-label">DRIFT SCORE</span>
            <span id="hud-score-val" class="hud-score-val">0</span>
          </div>

          <div id="hud-combo-badge" class="hud-combo-badge hidden">
            <span>🔥</span>
            <span id="hud-combo-text">x1.0</span>
          </div>

          <div id="hud-speed-badge" class="hud-speed-badge">0 km/h</div>
        </div>

        <!-- Mountain Downhill Progress Track -->
        <div class="hud-progress-container">
          <span class="progress-icon">🏔️</span>
          <div class="progress-bar-bg">
            <div id="hud-progress-fill" class="progress-bar-fill"></div>
          </div>
          <span class="progress-icon">🏁</span>
        </div>

        <div id="drift-callout" class="drift-callout">💨 漂移中! (42°)</div>
      </header>

      <!-- Start Screen Overlay -->
      <section id="start-screen" class="overlay-screen">
        <div class="card-box">
          <span class="card-tag">3D MOBILE CASUAL DRIFT</span>
          <h1 class="card-title">下山大甩尾！</h1>
          <p class="card-subtitle">
            從雲霧山頂一路漂移至山腳終點線！<br/>
            單手滑動甩尾，用車尾掃飛沿途觀賽人與柴柴！
          </p>

          <div class="guide-box">
            <div class="guide-item">
              <span class="guide-icon">🕹️</span>
              <span><strong>單手滑動</strong>：螢幕下半部按住滑動控制方向與大弧度甩尾</span>
            </div>
            <div class="guide-item">
              <span class="guide-icon">💨</span>
              <span><strong>極限拉煙</strong>：大幅度轉向自動觸發鎖死漂移累積高分</span>
            </div>
            <div class="guide-item">
              <span class="guide-icon">🎳</span>
              <span><strong>魔性擊飛</strong>：根據甩尾力道撞飛路旁人、貓、狗可獲高額加成！</span>
            </div>
          </div>

          <button id="start-race-btn" class="btn-primary" type="button">開始下山 🚗💨</button>
        </div>
      </section>

      <!-- Finish Summary Overlay -->
      <section id="finish-screen" class="overlay-screen hidden">
        <div class="card-box">
          <span class="card-tag">RUN COMPLETE 🏁</span>
          <h2 class="card-title">順利抵達山腳！</h2>

          <div class="summary-score-banner">
            <span class="hud-label">最終總甩尾成績</span>
            <div id="finish-score-val" class="summary-score-num">0</div>
            <div id="finish-title-val" class="summary-title-badge">秋名山老司機</div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">甩尾累積積分</div>
              <div id="stat-drift-pts" class="stat-value">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">魔性擊飛總次數</div>
              <div id="stat-yeet-count" class="stat-value">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">最長單次甩尾</div>
              <div id="stat-longest-drift" class="stat-value">0 秒</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">下山通關耗時</div>
              <div id="stat-race-time" class="stat-value">0 秒</div>
            </div>
          </div>

          <button id="share-btn" class="btn-primary interactive-ui" type="button">
            ✨ 分享我的甩尾戰報 (Threads / IG)
          </button>
          <button id="restart-btn" class="btn-secondary interactive-ui" type="button">
            再衝一趟 🔄
          </button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
