name: Deploy Drift Downhill 3D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          mkdir -p "pages-dist/垃圾清運行動"
          cp -r dist/* "pages-dist/垃圾清運行動/"
          cat << 'EOF' > pages-dist/index.html
          <!DOCTYPE html>
          <html lang="zh-TW">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=./垃圾清運行動/" />
            <title>垃圾清運行動</title>
            <script>window.location.replace("./垃圾清運行動/" + window.location.search + window.location.hash);</script>
          </head>
          <body>
            <p>正在前往 <a href="./垃圾清運行動/">垃圾清運行動</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
